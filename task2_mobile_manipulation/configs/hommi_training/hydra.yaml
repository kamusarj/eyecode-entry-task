hydra:
  run:
    dir: runs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}_${model.name}_${exp_name}
  sweep:
    dir: runs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}_${model.name}_${exp_name}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=diffusion_dit_3d
    - task=ego3d_lookat_policy
    - task.dataset_path=/home/linh/eyecode-part2/data/hommi_processed/sessions/laundry30/replay_buffer_laundry30.zarr.zip
    - task.shape_meta.obs.camera_head_main_rgb.shape=[3,256,256]
    - task.shape_meta.obs.camera_head_pointmap.shape=[3,256,256]
    - task.dataset.val_ratio=0.2
    - task.dataset.normalizer_num_workers=2
    - task.dataset.pointmap_validity_num_workers=2
    - task.dataset.cache_dir=/home/linh/eyecode-part2/data/hommi_cache
    - model.obs_encoder.model_name=dinov3-vits16-pretrain-lvd1689m
    - model.obs_encoder.pointcloud_model_name=dinov3-vits16-pretrain-lvd1689m
    - model.obs_encoder.n_emb=384
    - model.obs_encoder.num_points=128
    - model.attention_embed_dim=384
    - model.depth=6
    - model.num_heads=6
    - dataloader.batch_size=8
    - dataloader.num_workers=3
    - val_dataloader.batch_size=8
    - val_dataloader.num_workers=1
    - training.mixed_precision=bf16
    - training.num_epochs=60
    - training.sample_every=5
    - training.val_every=5
    - training.visualize_every=-1
    - checkpoint.topk.k=1
    - logging.mode=offline
    - exp_name=small_vits
  job:
    name: train
    chdir: null
    override_dirname: checkpoint.topk.k=1,dataloader.batch_size=8,dataloader.num_workers=3,exp_name=small_vits,logging.mode=offline,model.attention_embed_dim=384,model.depth=6,model.num_heads=6,model.obs_encoder.model_name=dinov3-vits16-pretrain-lvd1689m,model.obs_encoder.n_emb=384,model.obs_encoder.num_points=128,model.obs_encoder.pointcloud_model_name=dinov3-vits16-pretrain-lvd1689m,model=diffusion_dit_3d,task.dataset.cache_dir=/home/linh/eyecode-part2/data/hommi_cache,task.dataset.normalizer_num_workers=2,task.dataset.pointmap_validity_num_workers=2,task.dataset.val_ratio=0.2,task.dataset_path=/home/linh/eyecode-part2/data/hommi_processed/sessions/laundry30/replay_buffer_laundry30.zarr.zip,task.shape_meta.obs.camera_head_main_rgb.shape=[3,256,256],task.shape_meta.obs.camera_head_pointmap.shape=[3,256,256],task=ego3d_lookat_policy,training.mixed_precision=bf16,training.num_epochs=60,training.sample_every=5,training.val_every=5,training.visualize_every=-1,val_dataloader.batch_size=8,val_dataloader.num_workers=1
    id: ???
    num: ???
    config_name: umi_policy_dit
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.2'
    cwd: /home/linh/eyecode-part2/outputs
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/linh/eyecode-part2/third_party/hommi/hommi/train_network/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/linh/eyecode-part2/outputs/runs/2026.10.16/16.30.18_umi_policy_ego3d_lookat_policy_diffusion_dit_small_vits
    choices:
      model: diffusion_dit_3d
      task: ego3d_lookat_policy
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
